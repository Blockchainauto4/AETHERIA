<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aetheria Crypto Exchange & Ecosystem</title>
    <meta name="description" content="Corretora e ecossistema de criptomoedas de última geração com visualização interativa dos pilares, terminal de trading, swap e cofres de rendimento." />
    <meta property="og:title" content="Aetheria Crypto Exchange & Ecosystem" />
    <meta property="og:description" content="Corretora e ecossistema de criptomoedas de última geração com visualização interativa dos pilares, terminal de trading, swap e cofres de rendimento." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Suppress Vite HMR WebSocket reconnection errors in cloud/iframe preview
      window.addEventListener('error', function(e) {
        if (
          (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('@vite/client') !== -1)) ||
          (e.filename && e.filename.indexOf('@vite/client') !== -1) ||
          (e.error && e.error.stack && (e.error.stack.indexOf('createWebSocketModuleRunnerTransport') !== -1 || e.error.stack.indexOf('@vite/client') !== -1))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason;
        var msg = typeof reason === 'string' ? reason : (reason && (reason.message || reason.stack) ? (reason.message || '') + (reason.stack || '') : '');
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('@vite/client') !== -1 ||
          msg.indexOf('createWebSocketModuleRunnerTransport') !== -1
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
